name: Build GBA PocketFrame 1.0 Store Candidate

on:
  push:
    branches:
      - pocketframe-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct PocketFrame v0.2 base
        shell: bash
        run: |
          cat payload/chunk_00 payload/chunk_01 payload/chunk_02 > pocketframe.b64
          base64 -d pocketframe.b64 > pocketframe.zip
          unzip -q pocketframe.zip
          test -f PocketFrame/settings.gradle

      - name: Apply PocketFrame v0.3 base patch
        shell: bash
        run: |
          sed -i 's/setImmersive(/applyImmersive(/g' PocketFrame/app/src/main/java/com/pocketframe/app/MainActivity.java
          base64 -d payload/v03_patch.b64 | gzip -d > v03.patch
          patch -d PocketFrame -p2 < v03.patch

      - name: Install PocketFrame icon
        shell: bash
        run: |
          mkdir -p PocketFrame/app/src/main/res/mipmap-xxxhdpi
          base64 -d payload/v03_icon.b64 > PocketFrame/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          cp PocketFrame/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp PocketFrame/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.webp

      - name: Apply PocketFrame v0.3.2 delta
        shell: bash
        run: |
          base64 -d payload/v032_delta.b64 | gzip -d > v032.patch
          patch -d PocketFrame -p1 < v032.patch

      - name: Prepare 1.0 store candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("PocketFrame")

          gradle = root / "app/build.gradle"
          s = gradle.read_text()
          s = s.replace("versionCode 5", "versionCode 10")
          s = s.replace("versionName '0.3.2'", "versionName '1.0.0'")
          gradle.write_text(s)

          strings = root / "app/src/main/res/values/strings.xml"
          s = strings.read_text().replace(">PocketFrame<", ">GBA PocketFrame<")
          strings.write_text(s)

          main = root / "app/src/main/java/com/pocketframe/app/MainActivity.java"
          s = main.read_text()
          s = s.replace('title.setText("PocketFrame");', 'title.setText("GBA PocketFrame");')
          s = s.replace('statusText.setText("PocketFrame v0.3");', 'statusText.setText("GBA PocketFrame 1.0");')
          s = s.replace(
              'subtitle.setText("A clean GB · GBC · GBA player for your own games.\\nNo ads. No accounts. No tracking.");',
              'subtitle.setText("A clean GB · GBC · GBA player for your own games.\\nNo ads. No accounts. No tracking.\\nGames and ROM files are not included.");'
          )

          needle = '''        welcomeCard.addView(start, startLp);\n\n        root.addView(welcomeCard);'''
          insert = '''        welcomeCard.addView(start, startLp);\n\n        TextView privacy = capsule("PRIVACY", Color.rgb(34, 39, 47), TEXT, true);\n        privacy.setTextSize(11);\n        privacy.setOnClickListener(v -> showPrivacyPolicy());\n        LinearLayout.LayoutParams privacyLp = new LinearLayout.LayoutParams(\n                LinearLayout.LayoutParams.MATCH_PARENT, dp(44));\n        privacyLp.topMargin = dp(10);\n        welcomeCard.addView(privacy, privacyLp);\n\n        root.addView(welcomeCard);'''
          if needle not in s:
              raise SystemExit("privacy button insertion point not found")
          s = s.replace(needle, insert)

          needle2 = '''    private TextView capsule(String text, int background, int foreground, boolean bold) {'''
          method = '''    private void showPrivacyPolicy() {\n        final String policy =\n                "GBA PocketFrame Privacy Policy\\n\\n" +\n                "GBA PocketFrame does not collect, transmit, sell, or share personal data. " +\n                "The app has no account system, advertising SDK, analytics SDK, or network permission.\\n\\n" +\n                "ROM and archive files you choose are read locally on your device for emulation. " +\n                "Save RAM and save states are stored locally in the app's private storage. " +\n                "No game files or save data are uploaded by GBA PocketFrame.\\n\\n" +\n                "Bluetooth or USB game controller input is processed locally and is not recorded or transmitted.\\n\\n" +\n                "Games and ROM files are not included with the app. Users are responsible for using files they are legally entitled to use.\\n\\n" +\n                "Data retention: local save data remains on the device until you remove it or uninstall the app.\\n\\n" +\n                "Privacy inquiries: github.com/Hahyuck/cammykd/issues";\n\n        new AlertDialog.Builder(this)\n                .setTitle("Privacy Policy")\n                .setMessage(policy)\n                .setPositiveButton("OK", null)\n                .show();\n    }\n\n    private TextView capsule(String text, int background, int foreground, boolean bold) {'''
          if needle2 not in s:
              raise SystemExit("privacy method insertion point not found")
          s = s.replace(needle2, method)
          main.write_text(s)
          PY

          grep -q "versionCode 10" PocketFrame/app/build.gradle
          grep -q "versionName '1.0.0'" PocketFrame/app/build.gradle
          grep -q '<string name="app_name">GBA PocketFrame</string>' PocketFrame/app/src/main/res/values/strings.xml
          grep -q 'showPrivacyPolicy' PocketFrame/app/src/main/java/com/pocketframe/app/MainActivity.java

      - name: Store candidate feature checks
        shell: bash
        run: |
          MAIN=PocketFrame/app/src/main/java/com/pocketframe/app/MainActivity.java
          grep -q 'lower.endsWith(".gba")' "$MAIN"
          grep -q 'lower.endsWith(".gbc")' "$MAIN"
          grep -q 'lower.endsWith(".gb")' "$MAIN"
          grep -q 'lower.endsWith(".zip")' "$MAIN"
          grep -q 'lower.endsWith(".7z")' "$MAIN"
          grep -q 'onGenericMotionEvent' "$MAIN"
          grep -q 'SCANLINE_LCD_GRID' PocketFrame/app/src/main/java/com/pocketframe/app/GameSurface.java
          grep -q 'android:screenOrientation="fullUser"' PocketFrame/app/src/main/AndroidManifest.xml
          if grep -q 'android.permission.INTERNET' PocketFrame/app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build mGBA core
        shell: bash
        working-directory: PocketFrame
        run: |
          chmod +x scripts/fetch_mgba.sh
          scripts/fetch_mgba.sh
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          BUILD="$PWD/build/mgba-arm64-v8a"
          OUT="$PWD/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$BUILD"
          mkdir -p "$BUILD" "$OUT"
          cmake -S "$PWD/third_party/mgba" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=OFF \
            -DBUILD_LIBRETRO=ON \
            -DDISABLE_DEPS=ON \
            -DSKIP_LIBRARY=ON
          cmake --build "$BUILD" --target mgba_libretro --parallel
          cp "$BUILD/mgba_libretro.so" "$OUT/libmgba_libretro.so"

      - name: Build release App Bundle
        working-directory: PocketFrame
        run: gradle :app:bundleRelease --stacktrace

      - name: Smoke-check App Bundle
        shell: bash
        working-directory: PocketFrame
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -l "$AAB" | grep -q 'base/lib/arm64-v8a/libmgba_libretro.so'
          unzip -l "$AAB" | grep -q 'base/lib/arm64-v8a/libpocketframe_jni.so'
          sha256sum "$AAB"

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.0-unsigned-aab
          path: PocketFrame/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
