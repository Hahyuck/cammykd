name: Build GBA PocketFrame 0.5.0 RC5 APK

on:
  push:
    branches:
      - pocketframe-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct exact RC3 source
        shell: bash
        run: |
          cat staging/rc3src_aa staging/rc3src_ab staging/rc3src_ac staging/rc3src_ad staging/rc3src_ae > rc3src.b64
          base64 -d rc3src.b64 > rc3src.tar.gz
          tar -xzf rc3src.tar.gz
          rm -f GBA-PocketFrame-1.0.0/app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp.b64
          test -f GBA-PocketFrame-1.0.0/settings.gradle
          test -f GBA-PocketFrame-1.0.0/app/build.gradle
          base64 -d staging/rc4_patch.b64 | gzip -d > rc4.patch
          patch -p0 < rc4.patch
          cat staging/rc5p_00 staging/rc5p_01 staging/rc5p_02 staging/rc5p_03 staging/rc5p_04 > rc5_patch.b64
          base64 -d rc5_patch.b64 | gzip -d > rc5.patch
          cd GBA-PocketFrame-1.0.0
          patch -p1 < ../rc5.patch
          cd ..

      - name: RC5 stability and diagnostics checks
        shell: bash
        run: |
          ROOT="GBA-PocketFrame-1.0.0"
          MAIN="$ROOT/app/src/main/java/com/pocketframe/app/MainActivity.java"
          SURFACE="$ROOT/app/src/main/java/com/pocketframe/app/GameSurface.java"
          grep -q "versionName '0.5.0-rc5'" "$ROOT/app/build.gradle"
          grep -q '<string name="app_name">GBA PocketFrame</string>' "$ROOT/app/src/main/res/values/strings.xml"
          grep -q 'setMenuListener(this::showGameMenu)' "$MAIN"
          grep -q '"MENU"' "$SURFACE"
          grep -q 'isMenuHit' "$SURFACE"
          if grep -q 'pfMenuButton' "$MAIN"; then
            echo "Legacy floating PF menu still present" >&2
            exit 1
          fi
          grep -q 'ROM LOAD' "$MAIN"
          grep -q 'CLOSE GAME' "$MAIN"
          grep -q 'EXIT APP' "$MAIN"
          grep -q 'QUICK SAVE' "$MAIN"
          grep -q 'QUICK LOAD' "$MAIN"
          grep -q 'CONTROL LAYOUT' "$MAIN"
          grep -q 'SAVE CUSTOM PRESET' "$MAIN"
          grep -q 'LOAD PRESET' "$MAIN"
          grep -q 'showControlAdjustDialog' "$MAIN"
          grep -q 'POPUP_BG' "$MAIN"
          grep -q 'popupDivider' "$MAIN"
          grep -q 'Math.round(controlsDrawAlpha \* 0.90f)' "$SURFACE"
          test -f "$ROOT/app/src/main/java/com/pocketframe/app/Diagnostics.java"
          grep -q 'DIAGNOSTICS' "$MAIN"
          grep -q 'EXPORT REPORT' "$MAIN"
          grep -q 'ApplicationExitInfo' "$ROOT/app/src/main/java/com/pocketframe/app/Diagnostics.java"
          grep -q 'setDiagnosticListener' "$MAIN"
          grep -q 'onCheckpoint' "$SURFACE"
          grep -q 'android:allowBackup="false"' "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/PRIVACY.md"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build mGBA core
        shell: bash
        working-directory: GBA-PocketFrame-1.0.0
        run: |
          chmod +x scripts/fetch_mgba.sh
          scripts/fetch_mgba.sh
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          BUILD="$PWD/build/mgba-arm64-v8a"
          OUT="$PWD/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$BUILD"
          mkdir -p "$BUILD" "$OUT"
          cmake -S "$PWD/third_party/mgba" -B "$BUILD" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DBUILD_QT=OFF \
            -DBUILD_SDL=OFF \
            -DBUILD_LIBRETRO=ON \
            -DDISABLE_DEPS=ON \
            -DSKIP_LIBRARY=ON
          cmake --build "$BUILD" --target mgba_libretro --parallel
          cp "$BUILD/mgba_libretro.so" "$OUT/libmgba_libretro.so"

      - name: Build debug APK
        working-directory: GBA-PocketFrame-1.0.0
        run: gradle :app:assembleDebug --stacktrace

      - name: Smoke-check APK
        shell: bash
        working-directory: GBA-PocketFrame-1.0.0
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmgba_libretro.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpocketframe_jni.so'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='0.5.0-rc5'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "application-label:'GBA PocketFrame'"
          if "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-0.5.0-rc5-debug-apk
          path: GBA-PocketFrame-1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
