name: Build PocketFrame APK

on:
  push:
    branches:
      - pocketframe-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct PocketFrame source
        shell: bash
        run: |
          cat payload/chunk_00 payload/chunk_01 payload/chunk_02 payload/chunk_03 payload/chunk_04 payload/chunk_05 > pocketframe.b64
          base64 -d pocketframe.b64 > pocketframe.zip
          unzip -q pocketframe.zip
          test -f PocketFrame/settings.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build mGBA core
        shell: bash
        working-directory: PocketFrame
        run: |
          chmod +x scripts/fetch_mgba.sh
          scripts/fetch_mgba.sh
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          BUILD="$PWD/build/mgba-arm64-v8a"
          OUT="$PWD/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$BUILD"
          mkdir -p "$BUILD" "$OUT"
          cmake -S "$PWD/third_party/mgba" -B "$BUILD" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DBUILD_QT=OFF             -DBUILD_SDL=OFF             -DBUILD_LIBRETRO=ON             -DDISABLE_DEPS=ON             -DSKIP_LIBRARY=ON
          cmake --build "$BUILD" --target mgba_libretro --parallel
          cp "$BUILD/mgba_libretro.so" "$OUT/libmgba_libretro.so"
          file "$OUT/libmgba_libretro.so"

      - name: Build debug APK
        working-directory: PocketFrame
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketFrame-v0.1-debug-apk
          path: PocketFrame/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
