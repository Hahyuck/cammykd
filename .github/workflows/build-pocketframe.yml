name: Build PocketFrame v0.3.2 APK

on:
  push:
    branches: [pocketframe-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Reconstruct PocketFrame v0.2 base
        shell: bash
        run: |
          cat payload/chunk_00 payload/chunk_01 payload/chunk_02 > pocketframe.b64
          base64 -d pocketframe.b64 > pocketframe.zip
          unzip -q pocketframe.zip
          test -f PocketFrame/settings.gradle

      - name: Apply PocketFrame v0.3.2 overlay
        shell: bash
        run: |
          cat             overlay/v032_00 overlay/v032_01 overlay/v032_02             overlay/v032_03_00 overlay/v032_03_01 overlay/v032_03_02             overlay/v032_03_03 overlay/v032_03_04 overlay/v032_03_05             overlay/v032_04_00 overlay/v032_04_01 overlay/v032_04_02 overlay/v032_04_03             > v032-overlay.b64
          base64 -d v032-overlay.b64 > v032-overlay.zip
          unzip -oq v032-overlay.zip -d PocketFrame
          grep -q "versionName '0.3.2'" PocketFrame/app/build.gradle
          grep -q 'lower.endsWith(".gbc")' PocketFrame/app/src/main/java/com/pocketframe/app/MainActivity.java
          grep -q 'onGenericMotionEvent' PocketFrame/app/src/main/java/com/pocketframe/app/MainActivity.java
          # Commons Compress delegates LZMA/LZMA2 codecs to XZ for Java.
          sed -i "/commons-compress/a\    implementation 'org.tukaani:xz:1.10'" PocketFrame/app/build.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build mGBA core
        shell: bash
        working-directory: PocketFrame
        run: |
          chmod +x scripts/fetch_mgba.sh
          scripts/fetch_mgba.sh
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          BUILD="$PWD/build/mgba-arm64-v8a"
          OUT="$PWD/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$BUILD"
          mkdir -p "$BUILD" "$OUT"
          cmake -S "$PWD/third_party/mgba" -B "$BUILD" -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DBUILD_QT=OFF             -DBUILD_SDL=OFF             -DBUILD_LIBRETRO=ON             -DDISABLE_DEPS=ON             -DSKIP_LIBRARY=ON
          cmake --build "$BUILD" --target mgba_libretro --parallel
          cp "$BUILD/mgba_libretro.so" "$OUT/libmgba_libretro.so"

      - name: Build debug APK
        working-directory: PocketFrame
        run: gradle :app:assembleDebug --stacktrace

      - name: Smoke-check APK
        shell: bash
        working-directory: PocketFrame
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmgba_libretro.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpocketframe_jni.so'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "targetSdkVersion:'36'"
          if "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission" >&2
            exit 1
          fi
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketFrame-v0.3.2-debug-apk
          path: PocketFrame/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
