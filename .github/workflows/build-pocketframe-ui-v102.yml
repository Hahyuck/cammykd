name: Build PocketFrame 1.0.2 layout candidate

on:
  push:
    branches: [pocketframe-ui-v101]
    paths:
      - .github/workflows/build-pocketframe-ui-v102.yml
      - staging/ui-layout-v102.patch

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Check out layout candidate
        uses: actions/checkout@v4

      - name: Download the exact 1.0.0 source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37602644453
          name: GBA-PocketFrame-1.0.0-exact-source
          github-token: ${{ github.token }}
          path: source-artifact

      - name: Prepare 1.0.2 source
        shell: bash
        run: |
          set -euo pipefail
          test -s source-artifact/GBA-PocketFrame-1.0.0-exact-source.zip
          unzip -q source-artifact/GBA-PocketFrame-1.0.0-exact-source.zip
          ROOT=GBA-PocketFrame-1.0.0
          test -s "$ROOT/app/src/main/jniLibs/arm64-v8a/libmgba_libretro.so"
          grep -q "versionCode 100" "$ROOT/app/build.gradle"
          grep -q "versionName '1.0.0'" "$ROOT/app/build.gradle"
          grep -q 'OPEN SOURCE LICENSES' "$ROOT/app/src/main/java/com/pocketframe/app/MainActivity.java"
          (cd "$ROOT" && patch -p1 --batch --forward < ../staging/ui-display-v101.patch)
          (cd "$ROOT" && patch -p1 --batch --forward < ../staging/ui-display-v101-safety.patch)
          (cd "$ROOT" && patch -p1 --batch --forward < ../staging/ui-layout-v102.patch)
          sed -i "s/versionCode 100/versionCode 102/" "$ROOT/app/build.gradle"
          sed -i "s/versionName '1.0.0'/versionName '1.0.2'/" "$ROOT/app/build.gradle"
          sed -i 's/1.0.0/1.0.2/g' "$ROOT/app/src/main/java/com/pocketframe/app/Diagnostics.java"
          grep -q 'VIDEO_PIXEL_1X' "$ROOT/app/src/main/java/com/pocketframe/app/GameSurface.java"
          grep -q 'UI TRANSPARENCY' "$ROOT/app/src/main/java/com/pocketframe/app/MainActivity.java"
          grep -q 'saveLayerAlpha' "$ROOT/app/src/main/java/com/pocketframe/app/GameSurface.java"
          grep -q "applicationId 'com.gbapocketframe.app'" "$ROOT/app/build.gradle"
          grep -q "namespace 'com.pocketframe.app'" "$ROOT/app/build.gradle"
          grep -q "versionCode 102" "$ROOT/app/build.gradle"
          grep -q "versionName '1.0.2'" "$ROOT/app/build.gradle"
          grep -q "implementation 'org.tukaani:xz:1.12'" "$ROOT/app/build.gradle"
          grep -q 'Error and Android process-exit messages may contain' "$ROOT/app/src/main/java/com/pocketframe/app/MainActivity.java"
          grep -q 'android:allowBackup="false"' "$ROOT/app/src/main/AndroidManifest.xml"
          test -s "$ROOT/app/src/main/assets/open_source_licenses.txt"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Check landscape viewport and touch-target separation
        working-directory: GBA-PocketFrame-1.0.0
        run: |
          javac -d ../host-layout-check app/src/main/java/com/pocketframe/app/LandscapeLayout.java tests/host/LandscapeLayoutTest.java
          java -cp ../host-layout-check com.pocketframe.app.LandscapeLayoutTest

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build debug APK, unsigned release APK and release AAB
        working-directory: GBA-PocketFrame-1.0.0
        run: gradle :app:assembleDebug :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Check outputs and archive exact source
        shell: bash
        working-directory: GBA-PocketFrame-1.0.0
        run: |
          set -euo pipefail
          DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk
          RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          for package in "$DEBUG_APK" "$RELEASE_APK" "$AAB"; do
            test -s "$package"
            unzip -t "$package" >/dev/null
          done
          for apk in "$DEBUG_APK" "$RELEASE_APK"; do
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libmgba_libretro.so'
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libpocketframe_jni.so'
            unzip -l "$apk" | grep -q 'assets/open_source_licenses.txt'
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.gbapocketframe.app'"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "versionCode='102'"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "versionName='1.0.2'"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "targetSdkVersion:'36'"
            if "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
              echo 'Unexpected INTERNET permission' >&2
              exit 1
            fi
          done
          sha256sum "$DEBUG_APK" "$RELEASE_APK" "$AAB"
          (cd .. && zip -qr GBA-PocketFrame-1.0.2-exact-source.zip GBA-PocketFrame-1.0.0 \
            -x 'GBA-PocketFrame-1.0.0/build/*' \
               'GBA-PocketFrame-1.0.0/app/build/*' \
               'GBA-PocketFrame-1.0.0/app/.cxx/*' \
               'GBA-PocketFrame-1.0.0/.gradle/*' \
               'GBA-PocketFrame-1.0.0/third_party/mgba/.git/*')

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.2-ui-debug-apk
          path: GBA-PocketFrame-1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.2-ui-unsigned-release-apk
          path: GBA-PocketFrame-1.0.0/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.2-ui-unsigned-aab
          path: GBA-PocketFrame-1.0.0/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.2-exact-source
          path: GBA-PocketFrame-1.0.2-exact-source.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/pocketframe-ui-v101'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download this build's unsigned AAB
        uses: actions/download-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.2-ui-unsigned-aab
          path: unsigned-aab

      - name: Download the matching unsigned release APK
        uses: actions/download-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.2-ui-unsigned-release-apk
          path: unsigned-apk

      - name: Validate and publish matching public prerelease packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          AAB=unsigned-aab/app-release.aab
          APK=unsigned-apk/app-release-unsigned.apk
          test -s "$AAB"
          test -s "$APK"
          unzip -t "$AAB" >/dev/null
          unzip -t "$APK" >/dev/null
          install -m 644 "$AAB" GBA-PocketFrame-1.0.2-unsigned.aab
          install -m 644 "$APK" GBA-PocketFrame-1.0.2-unsigned.apk
          sha256sum GBA-PocketFrame-1.0.2-unsigned.aab GBA-PocketFrame-1.0.2-unsigned.apk
          printf 'Unsigned app bundle and release APK from successful Actions run %s at source commit %s.\n\nThese packages are not signed and are not Google Play approved. The developer must sign them locally with the existing upload key before installation or Play upload. No signing keys are included.\n' \
            "$BUILD_RUN_ID" "$SOURCE_SHA" > release-notes.txt
          gh release create pocketframe-1.0.2-unsigned-candidate1 \
            GBA-PocketFrame-1.0.2-unsigned.aab \
            GBA-PocketFrame-1.0.2-unsigned.apk \
            --target "$SOURCE_SHA" \
            --title 'GBA PocketFrame 1.0.2 unsigned build for local signing' \
            --notes-file release-notes.txt \
            --prerelease \
            --latest=false
