name: Build PocketFrame 1.0.1 UI candidate

on:
  push:
    branches: [pocketframe-ui-v101]
    paths:
      - .github/workflows/build-pocketframe-ui-v101.yml
      - staging/ui-display-v101.patch
      - staging/ui-display-v101-safety.patch

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Check out UI candidate
        uses: actions/checkout@v4

      - name: Download the exact 1.0.0 source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37602644453
          name: GBA-PocketFrame-1.0.0-exact-source
          github-token: ${{ github.token }}
          path: source-artifact

      - name: Prepare 1.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          test -s source-artifact/GBA-PocketFrame-1.0.0-exact-source.zip
          unzip -q source-artifact/GBA-PocketFrame-1.0.0-exact-source.zip
          ROOT=GBA-PocketFrame-1.0.0
          test -s "$ROOT/app/src/main/jniLibs/arm64-v8a/libmgba_libretro.so"
          grep -q "versionCode 100" "$ROOT/app/build.gradle"
          grep -q "versionName '1.0.0'" "$ROOT/app/build.gradle"
          grep -q 'OPEN SOURCE LICENSES' "$ROOT/app/src/main/java/com/pocketframe/app/MainActivity.java"
          (cd "$ROOT" && patch -p1 --batch --forward < ../staging/ui-display-v101.patch)
          (cd "$ROOT" && patch -p1 --batch --forward < ../staging/ui-display-v101-safety.patch)
          sed -i "s/versionCode 100/versionCode 101/" "$ROOT/app/build.gradle"
          sed -i "s/versionName '1.0.0'/versionName '1.0.1'/" "$ROOT/app/build.gradle"
          sed -i 's/1.0.0/1.0.1/g' "$ROOT/app/src/main/java/com/pocketframe/app/Diagnostics.java"
          grep -q 'VIDEO_PIXEL_1X' "$ROOT/app/src/main/java/com/pocketframe/app/GameSurface.java"
          grep -q 'UI TRANSPARENCY' "$ROOT/app/src/main/java/com/pocketframe/app/MainActivity.java"
          grep -q 'saveLayerAlpha' "$ROOT/app/src/main/java/com/pocketframe/app/GameSurface.java"
          grep -q "versionCode 101" "$ROOT/app/build.gradle"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build debug APK and unsigned release AAB
        working-directory: GBA-PocketFrame-1.0.0
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Check outputs
        shell: bash
        working-directory: GBA-PocketFrame-1.0.0
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmgba_libretro.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libpocketframe_jni.so'
          unzip -l "$APK" | grep -q 'assets/open_source_licenses.txt'
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.gbapocketframe.app'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionCode='101'"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "versionName='1.0.1'"
          sha256sum "$APK" "$AAB"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.1-ui-debug-apk
          path: GBA-PocketFrame-1.0.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: GBA-PocketFrame-1.0.1-ui-unsigned-aab
          path: GBA-PocketFrame-1.0.0/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
